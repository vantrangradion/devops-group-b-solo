apiVersion: v1
kind: Service
metadata:
  name: devops-app-lb
  namespace: devops-app
  labels:
    app.kubernetes.io/name: devops-app
    # The Pillar 3 ServiceMonitor must exclude this Service (e.g. a
    # matchExpressions NotIn on this label), or each pod is scraped twice.
    app.kubernetes.io/component: remote-access
spec:
  # k3d maps host port 8080 here (-p "8080:8080@loadbalancer"). Not 80/443:
  # k3s's Traefik LoadBalancer owns those ports.
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: devops-app
  ports:
    - name: http
      port: 8080
      targetPort: http
