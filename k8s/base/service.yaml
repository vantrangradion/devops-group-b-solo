apiVersion: v1
kind: Service
metadata:
  name: devops-app
  namespace: devops-app
  labels:
    app.kubernetes.io/name: devops-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: devops-app
  ports:
    # The Pillar 3 ServiceMonitor endpoint selects this port by name.
    - name: http
      port: 8080
      targetPort: http
