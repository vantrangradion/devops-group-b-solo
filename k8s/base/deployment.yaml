apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
  namespace: devops-app
  labels:
    app.kubernetes.io/name: devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-app
    spec:
      # The app never calls the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      # One replica per node, so losing a node leaves a copy serving. Honor
      # skips a tainted (failed) node, so its replacement can still land on
      # the healthy one; pod-template-hash keeps old pods out of the count
      # during a rolling update.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: devops-app
      containers:
        - name: devops-app
          image: ghcr.io/vantrangradion/devops-app:e6310d51cbd8424c9b131ec460f1ca90b92ddcac
          ports:
            - name: http
              containerPort: 8080
            # Fault toggles (app/README.md#fault-toggles). In no Service, so
            # neither the LoadBalancer nor the tunnel reaches it; use
            # scripts/fault.sh or kubectl port-forward.
            - name: admin
              containerPort: 8081
          # Explicit keyRefs, not envFrom: a missing key fails the pod start
          # instead of silently falling back to the image default.
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: devops-app
                  key: APP_ENV
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: devops-app
                  key: MESSAGE
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: devops-app
                  key: API_KEY
            # Traces, metrics and logs go to the Collector in monitoring
            # (tracing/). Unset, the app sends none of them.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc:4318
            # The SDK default is 60 s; 5 s keeps the dashboard following the
            # live k6 run.
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "5000"
            - name: OTEL_SERVICE_NAME
              value: devops-app
            # Each span, metric series and log record names the pod that
            # served it; the Collector turns these into the namespace and pod
            # labels, and Prometheus uses service.instance.id as the instance
            # label.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.name=$(POD_NAME),k8s.namespace.name=devops-app,service.instance.id=$(POD_NAME)
          # /ready follows the "ready" fault toggle, so a pod can be taken out
          # of the Service endpoints during the demo. The first probe
          # otherwise races the listener and logs a refused connection on
          # every start.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 2
          # Stays on /health: a not-ready pod must not be restarted.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Measured per pod: idle 1m/5Mi, k6 100 VUs (~1.7k rps) ~530m/15Mi; limits leave ~2x CPU, ~8x memory for Pillar 3.
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 128Mi
          # The app closes its listener on SIGTERM; keep serving while the
          # endpoint removal reaches kube-proxy. The default 30 s grace period
          # covers this sleep plus the app's 10 s drain.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
