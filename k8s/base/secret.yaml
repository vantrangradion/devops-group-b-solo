# The API server stores Secret values only base64-encoded, which is an
# encoding, not encryption. A real secret would be created out of band
# (kubectl create secret) or stored encrypted (Sealed Secrets, SOPS).
# stringData, not data: gitleaks flags any base64 value under data.
apiVersion: v1
kind: Secret
metadata:
  name: devops-app
  namespace: devops-app
  labels:
    app.kubernetes.io/name: devops-app
type: Opaque
stringData:
  API_KEY: demo-not-a-real-key # obviously fake placeholder, safe in a public repo
