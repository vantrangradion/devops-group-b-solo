apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
# The Grafana sidecar loads ConfigMaps labelled grafana_dashboard=1 in
# monitoring, so the dashboard JSON is the only copy.
configMapGenerator:
  - name: devops-app-dashboard
    files:
      - devops-app.json=dashboards/devops-app.json
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
