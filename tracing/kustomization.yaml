apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - collector.yaml
# The hash suffix changes with the config, so editing collector-config.yaml
# rolls the Collector pod on the next apply.
configMapGenerator:
  - name: otel-collector
    files:
      - config.yaml=collector-config.yaml
