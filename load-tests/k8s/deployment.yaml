# Steady background load (#140). Outside k8s/, so Argo CD does not manage it
# and it can be scaled by hand during the demo:
#   kubectl scale deploy/k6-steady -n devops-app --replicas=0|1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k6-steady
  namespace: devops-app
  labels:
    app.kubernetes.io/name: k6-steady
    app.kubernetes.io/component: load
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k6-steady
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k6-steady
        app.kubernetes.io/component: load
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The k6 image's own user.
        runAsUser: 12345
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k6
          # k6 v2.3.0, the version load-tests/README.md is tested with.
          image: grafana/k6:2.3.0@sha256:2dd4756ec6e14e62778916e1eb850108e4b499304c02df56760fa0bdb0fba0b8
          # The image's entrypoint is k6. A run ends after 24 h; the pod's
          # restartPolicy (Always) starts the next one.
          args: [run, --quiet, --no-usage-report, /scripts/steady.js]
          env:
            - name: BASE_URL
              value: http://devops-app:8080
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            # k6 needs a writable temp dir; the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: scripts
          configMap:
            name: k6-steady
        - name: tmp
          emptyDir: {}
