# Lint, Test and Security run in parallel. Build builds the image once and
# verifies that exact image. On push only, Publish pushes, signs and attests it.
name: CI

on:
  push:
    branches: [main]
    # Release tags also publish; paths filters never apply to tag pushes.
    tags: ["v*"]
    paths-ignore:
      - "captures/**"
      - "docs/**"
  # No path filter, so required PR checks always report.
  pull_request:
    branches: [main]

# A new commit cancels the PR run it replaces. A running main run always
# finishes, so a publish is never cut off halfway. Main runs are serialized so
# :latest never moves back to an older commit; GitHub keeps only the newest
# pending run, so a commit queued behind it gets no :<sha> image.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Actions are pinned to commit SHAs, because a tag can be moved to new code.
jobs:
  lint:
    # Job names are the required status checks; keep them exact.
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      # Must match GOLANGCI_LINT_VERSION in app/Makefile.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: app
          args: --config .golangci.yml

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - run: go test ./...

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      # Full history, so gitleaks also finds secrets that were committed and later deleted.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The gitleaks container needs no licence key, unlike gitleaks-action on
      # org repos. safe.directory lets its git read a checkout owned by another user.
      - name: Scan for secrets
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --verbose

      # Reads lockfiles for any language (go.sum here), so this step is the same in every repo.
      - name: Audit dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  build:
    name: Build
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      tags: ${{ steps.meta.outputs.tags }}
      id: ${{ steps.save.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # GHCR names must be lowercase.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devops-app" >> "$GITHUB_OUTPUT"

      # Adds org.opencontainers.image.source, which links the package to the repo.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      # Built once and loaded into the local daemon. Every later step uses this
      # image, and Publish pushes it rather than building again.
      # provenance: false keeps GHCR to one linux/amd64 entry; provenance is
      # attested separately in Publish.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          platforms: linux/amd64
          provenance: false
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: make -C app smoke IMAGE=${{ steps.image.outputs.name }} TAG=${{ github.sha }}

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Also uploaded as a workflow artifact, so PR runs keep their SBOM too.
      # Publish attests this same file.
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.image.outputs.name }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json

      # Hands the verified image to Publish. Its ID lets Publish check that it
      # pushes exactly what was tested here.
      - name: Save image
        id: save
        if: github.event_name == 'push'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          echo "$TAGS" | xargs docker save -o "$RUNNER_TEMP/image.tar"
          echo "id=$(docker inspect --format '{{.Id}}' "$IMAGE:$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Upload image
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          if-no-files-found: error

  # Skipped on PRs, so it is not a required check (a skipped check passes anyway).
  publish:
    name: Publish
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing and attestations use the workflow's OIDC token.
      id-token: write
      attestations: write
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: ${{ runner.temp }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom.spdx.json

      - name: Load image
        env:
          VERIFIED_ID: ${{ needs.build.outputs.id }}
        run: |
          docker load -i "$RUNNER_TEMP/image.tar"
          id=$(docker inspect --format '{{.Id}}' "$IMAGE:$GITHUB_SHA")
          if [ "$id" != "$VERIFIED_ID" ]; then
            echo "::error::loaded image $id is not the verified image $VERIFIED_ID"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        env:
          TAGS: ${{ needs.build.outputs.tags }}
        run: |
          for tag in $TAGS; do docker push "$tag"; done
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signs the digest, not a tag, so the signature covers exactly these bytes.
      - name: Sign image
        run: cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"

      - name: Attest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
