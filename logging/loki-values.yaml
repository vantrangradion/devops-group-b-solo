# grafana-community/loki, pinned to chart 20.2.2 (Loki 3.7.9). One Monolithic
# pod, filesystem storage on an emptyDir, no persistence: logs are lost when
# the pod restarts, which is fine for a local demo. Only the Collector writes
# here, over Loki's native OTLP endpoint (/otlp/v1/logs on 3100).
deploymentMode: Monolithic
loki:
  # Single tenant, so the Collector and Grafana need no X-Scope-OrgID header.
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  # OTLP resource attributes such as service.name and k8s.pod.name become
  # index labels; log attributes and trace_id/span_id become structured
  # metadata, which needs schema v13 and this flag (the Loki 3 default, kept
  # explicit because trace correlation depends on it).
  limits_config:
    allow_structured_metadata: true
  # No anonymous usage report to Grafana Labs.
  analytics:
    reporting_enabled: false
singleBinary:
  replicas: 1
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  # With persistence off the chart mounts an emptyDir at /var/loki for
  # chunks, index and WAL, so the root filesystem stays read-only.
# Monolithic needs none of the scalable targets, the gateway, the caches, the
# canary, the chart test or the rules sidecar (no alerting rules).
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
sidecar:
  rules:
    enabled: false
